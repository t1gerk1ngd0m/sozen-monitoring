[package]
name = "sozen-monitor"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bootstrap"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
wreq = { version = "6.0.0-rc.28", default-features = false, features = [
  "gzip",
  "brotli",
  "cookies",
  "json",
] }
wreq-util = "3.0.0-rc.11"
aws-config = { version = "1", features = ["behavior-version-latest"] }
lambda_runtime = "0.13"
scraper = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aws-sdk-sesv2 = "1"
aws-sdk-ssm = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
anyhow = "1"
thiserror = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = "z"
panic = "abort"
